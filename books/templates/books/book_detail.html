<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{{ book.title }}</title>
</head>
<body>
    <a href="{% url 'book_list' %}">← Назад к списку</a>
    <h1>{{ book.title }}</h1>
    <p>Автор: {{ book.author.name }}</p>
    <p>Дата публикации: {{ book.published_date }}</p>
    <p>Жанр: {{ book.genre }}</p>
    <p>Страниц: {{ book.pages }}</p>
    <p>{{ book.description }}</p>
</body>
</html>
