<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Коллекция книг</title>
</head>
<body>
    <h1>Коллекция книг</h1>
    <ul>
        {% for book in books %}
            <li>
                <a href="{% url 'book_detail' book.pk %}">{{ book.title }}</a>
                — {{ book.author.name }} ({{ book.published_date }})
            </li>
        {% empty %}
            <li>Книг пока нет</li>
        {% endfor %}
    </ul>
</body>
</html>
